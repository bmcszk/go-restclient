name: Go Unit Tests

on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push coverage badge JSON to gh-pages
    strategy:
      matrix:
        go-version: [ '1.21', '1.22', '1.23', '1.24' ]
    steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

    - name: Run tests
      run: |
        make install-gotestsum
        gotestsum --junitfile unit-tests.xml -- -covermode=atomic -coverprofile=coverage.out ./...

    - name: Publish coverage badge (Go 1.24 + master only)
      if: matrix.go-version == '1.24' && github.ref == 'refs/heads/master'
      run: |
        PCT=$(go tool cover -func=coverage.out | awk '/total/ {gsub("%",""); print $3}')
        COLOR=brightgreen; awk -v p="$PCT" 'BEGIN{exit !(p<80)}' && COLOR=green
        awk -v p="$PCT" 'BEGIN{exit !(p<60)}' && COLOR=yellow
        mkdir -p /tmp/badges
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" > /tmp/badges/coverage.json
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin gh-pages --depth=1 2>/dev/null || true
        if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
          git checkout -B gh-pages origin/gh-pages
        else
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
        fi
        mkdir -p badges
        cp /tmp/badges/coverage.json badges/coverage.json
        git add badges/coverage.json
        git commit -m "chore(badges): coverage $PCT%" --allow-empty
        git push origin gh-pages
